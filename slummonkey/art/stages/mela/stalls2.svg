    <circle cx="170" cy="380" r="26" fill="var(--wood)"/><circle cx="310" cy="380" r="26" fill="var(--wood)"/>
    <path d="M240 300 V140" stroke-width="8"/>
    <path d="M110 160 C 160 90, 320 90, 370 160Z" fill="var(--paper)"/>
    <path d="M150 160 C 170 110, 200 100, 240 96 M330 160 C 310 110, 280 100, 240 96" fill="none" stroke="var(--vermilion)" stroke-width="16"/>
    <g fill="var(--marigold)"><circle cx="170" cy="290" r="12"/><circle cx="200" cy="286" r="12"/><circle cx="230" cy="290" r="12"/><circle cx="290" cy="288" r="12"/></g>
  </g>
