    <ellipse cx="690" cy="170" rx="50" ry="14" fill="none" stroke="var(--marigold)" stroke-width="8"/>
<ellipse cx="690" cy="216" rx="50" ry="14" fill="none" stroke="var(--peacock)" stroke-width="8"/>
<ellipse cx="690" cy="262" rx="50" ry="14" fill="none" stroke="var(--marigold)" stroke-width="8"/>
<ellipse cx="690" cy="308" rx="50" ry="14" fill="none" stroke="var(--peacock)" stroke-width="8"/>
<ellipse cx="690" cy="354" rx="50" ry="14" fill="none" stroke="var(--marigold)" stroke-width="8"/>
  </g>
  <!-- a nimbu-pani stall with a striped awning and glass jars -->
