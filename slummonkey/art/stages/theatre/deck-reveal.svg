  <g fill="var(--marigold)"><ellipse cx="85" cy="54" rx="14" ry="7"/><ellipse cx="285" cy="54" rx="14" ry="7"/><ellipse cx="485" cy="54" rx="14" ry="7"/><ellipse cx="685" cy="54" rx="14" ry="7"/></g></g>
