  <circle cx="176" cy="134" r="20" fill="var(--midnight)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="176" cy="134" r="7" fill="var(--steel)"/>
