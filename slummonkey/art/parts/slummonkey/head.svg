<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 130">
  <!-- back ear -->
  <circle cx="30" cy="66" r="19" fill="var(--monkey-fur)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="30" cy="66" r="9" fill="var(--rani)" opacity="0.75"/>
  <!-- skull -->
  <path d="M28 70 C 24 30, 56 12, 82 16 C 112 20, 128 44, 124 74 C 120 104, 96 118, 70 116 C 44 114, 30 98, 28 70Z" fill="var(--monkey-fur)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M40 40 C 52 24, 76 20, 92 26" fill="none" stroke="var(--monkey-fur-dark)" stroke-width="7" stroke-linecap="round"/>
  <!-- face mask (heart) -->
  <path d="M58 56 C 60 40, 82 38, 88 50 C 94 38, 118 40, 120 58 C 124 80, 112 106, 86 108 C 62 108, 50 84, 58 56Z" fill="var(--monkey-face)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- natural eye -->
  <ellipse cx="80" cy="60" rx="10" ry="13" fill="var(--white)" stroke="var(--ink)" stroke-width="5"/>
  <circle cx="84" cy="62" r="6" fill="var(--ink)"/><circle cx="86" cy="59" r="2.2" fill="var(--white)"/>
  <path d="M68 44 C 74 40, 84 40, 90 44" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
  <!-- cyborg eye plate -->
  <path d="M96 46 L 122 44 L 126 66 L 104 74 Z" fill="var(--steel)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="111" cy="59" r="9" fill="var(--cyber)" stroke="var(--ink)" stroke-width="4"/>
  <circle cx="111" cy="59" r="4" fill="var(--white)"/>
  <path d="M98 74 L 92 84 M104 74 L 104 86" stroke="var(--steel-dark)" stroke-width="4" stroke-linecap="round"/>
  <!-- nose + grin -->
  <path d="M102 78 C 106 76, 110 78, 108 82" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
  <path d="M74 86 C 86 104, 112 102, 120 84 C 104 90, 88 90, 74 86Z" fill="var(--velvet-dark)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M80 88 C 92 92, 106 92, 116 87 L 114 92 C 104 96, 90 96, 82 92Z" fill="var(--white)"/>
  <rect x="98" y="89" width="7" height="6" fill="var(--marigold)" stroke="var(--ink)" stroke-width="1.5"/>
  <!-- front ear -->
  <path d="M58 70 C 46 60, 44 84, 56 86" fill="var(--monkey-fur)" stroke="var(--ink)" stroke-width="5"/>
  <!-- backwards cap -->
  <path d="M40 34 C 46 8, 96 0, 116 26 C 100 22, 64 24, 40 34Z" fill="var(--hoodie)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M44 32 C 30 30, 8 36, 4 44 C 18 46, 34 42, 46 38Z" fill="var(--hoodie-dark)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="80" cy="10" r="5" fill="var(--marigold)" stroke="var(--ink)" stroke-width="3"/>
  <path d="M70 22 C 80 18, 92 18, 102 22" fill="none" stroke="var(--white)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <!-- hair tuft -->
  <path d="M118 30 C 126 22, 132 26, 128 34 C 136 32, 136 40, 126 42" fill="var(--monkey-fur)" stroke="var(--ink)" stroke-width="4"/>
</svg>
