<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560">
  <!-- a figure made of stage curtains -->
  <path d="M210 20 C 120 20, 70 90, 60 180 C 40 300, 10 420, 0 556 L 420 556 C 410 420, 380 300, 360 180 C 350 90, 300 20, 210 20Z" fill="var(--velvet)" stroke="var(--ink)" stroke-width="9" stroke-linejoin="round"/>
  <g fill="none" stroke="var(--velvet-dark)" stroke-width="26" stroke-linecap="round"><path d="M110 120 C 90 260, 70 400, 50 556"/><path d="M170 200 C 160 320, 150 440, 140 556"/><path d="M250 200 C 260 320, 270 440, 280 556"/><path d="M310 120 C 330 260, 350 400, 370 556"/></g>
  <g fill="none" stroke="var(--velvet-light)" stroke-width="12" stroke-linecap="round" opacity="0.8"><path d="M140 160 C 126 280, 112 420, 96 556"/><path d="M280 160 C 294 280, 308 420, 324 556"/></g>
  <!-- hood shadow with Raj's giant face looming out of it -->
  <path d="M110 120 C 120 50, 300 50, 310 120 C 316 230, 104 230, 110 120Z" fill="var(--midnight)" stroke="var(--ink)" stroke-width="8"/>
  <path d="M140 150 C 140 100, 280 100, 280 150 C 282 210, 140 214, 140 150Z" fill="var(--skin-2)" stroke="var(--ink)" stroke-width="7"/>
  <!-- furious brows -->
  <path d="M148 118 L 200 136 M272 118 L 220 136" stroke="var(--ink)" stroke-width="14" stroke-linecap="round"/>
  <!-- glowing chart-red eyes -->
  <ellipse cx="182" cy="146" rx="18" ry="13" fill="var(--candle-red)" stroke="var(--ink)" stroke-width="5"/>
  <ellipse cx="238" cy="146" rx="18" ry="13" fill="var(--candle-red)" stroke="var(--ink)" stroke-width="5"/>
  <circle cx="186" cy="146" r="5" fill="var(--marigold)"/><circle cx="234" cy="146" r="5" fill="var(--marigold)"/>
  <!-- curled moustache shaped like a crashing chart -->
  <path d="M210 172 C 230 160, 262 160, 280 170 L 296 158 L 292 182 C 270 186, 244 184, 226 180Z" fill="var(--ink)"/>
  <path d="M210 172 C 190 160, 158 160, 140 170 L 124 158 L 128 182 C 150 186, 176 184, 194 180Z" fill="var(--ink)"/>
  <!-- grin full of gold teeth -->
  <path d="M170 186 C 190 214, 230 214, 250 186 C 236 196, 184 196, 170 186Z" fill="var(--velvet-dark)" stroke="var(--ink)" stroke-width="5"/>
  <path d="M180 192 L 186 202 M196 196 L 198 206 M212 197 L 212 207 M228 196 L 226 206 M240 192 L 236 202" stroke="var(--gold)" stroke-width="6" stroke-linecap="round"/>
  <!-- gold tieback belt + the top-hat crown -->
  <path d="M70 300 C 160 330, 260 330, 350 300" fill="none" stroke="var(--gold)" stroke-width="18" stroke-linecap="round"/>
  <path d="M70 300 C 160 330, 260 330, 350 300" fill="none" stroke="var(--ink)" stroke-width="4" stroke-dasharray="14 10"/>
  <rect x="160" y="0" width="100" height="40" fill="var(--midnight)" stroke="var(--ink)" stroke-width="7"/>
  <path d="M140 40 L 280 40" stroke="var(--ink)" stroke-width="14" stroke-linecap="round"/>
  <!-- ticker tape -->
  <path d="M60 420 C 160 400, 260 440, 360 410" fill="none" stroke="var(--paper)" stroke-width="22"/>
  <path d="M80 418 h10 M110 414 h18 M150 414 h10 M190 420 h22 M240 424 h12 M280 420 h16 M320 414 h10" stroke="var(--candle-red)" stroke-width="6"/>
</svg>
