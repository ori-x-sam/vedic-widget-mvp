  <g fill="none" stroke="var(--velvet-light)" stroke-width="12" stroke-linecap="round" opacity="0.8"><path d="M140 160 C 126 280, 112 420, 96 556"/><path d="M280 160 C 294 280, 308 420, 324 556"/></g>
