# xcodegen spec for VedicWidget.
# Run `xcodegen generate` at the repo root to regenerate VedicWidget.xcodeproj.
# Nothing in this file is checked into the Xcode project — edit here, regenerate.

name: VedicWidget

options:
  bundleIdPrefix: com.yourteam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

# -----------------------------------------------------------------------------
# Global build settings
# -----------------------------------------------------------------------------
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""                 # fill in your Apple Team ID
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

# -----------------------------------------------------------------------------
# Swiss Ephemeris packaged as a static C library (compiled via SwiftPM target,
# but Xcode doesn't know about Package.swift — we declare the sources inline).
# -----------------------------------------------------------------------------
packages:
  # None — we vendor swisseph as source files compiled into VedicCore framework.

# -----------------------------------------------------------------------------
# Targets
# -----------------------------------------------------------------------------
targets:

  # ---------------------------------------------------------------------------
  # VedicCore — framework shared by app and widget extension.
  # Contains Swiss Ephemeris C sources, Panchanga/Guidance engines, models,
  # and shared UI primitives (ArcShape, WidgetColor).
  # ---------------------------------------------------------------------------
  VedicCore:
    type: framework
    platform: iOS
    sources:
      - path: VedicCore
        excludes:
          - "Ephemeris/swisseph/setest/**"
          - "Ephemeris/swisseph/bin/**"
          - "Ephemeris/swisseph/contrib/**"
          - "Ephemeris/swisseph/doc/**"
          - "Ephemeris/swisseph/windows/**"
          - "Ephemeris/swisseph/ephe/**"
          - "Ephemeris/swisseph/**/*.md"
          - "Ephemeris/swisseph/**/*.txt"
          # Exclude swisseph sources we don't compile (test drivers, etc.)
          - "Ephemeris/swisseph/swetest.c"
          - "Ephemeris/swisseph/swemini.c"
          - "Ephemeris/swisseph/swevents.c"  # only if unused by app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourteam.vedicwidget.core
        DEFINES_MODULE: YES
        GCC_PREPROCESSOR_DEFINITIONS: "MSDOS=1 $(inherited)"
        CLANG_WARN_STRICT_PROTOTYPES: NO
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        HEADER_SEARCH_PATHS: "$(SRCROOT)/VedicCore/Ephemeris/swisseph"

  # ---------------------------------------------------------------------------
  # VedicWidget — main iOS app.
  # Onboarding, Today view (with scrubber), Settings.
  # ---------------------------------------------------------------------------
  VedicWidget:
    type: application
    platform: iOS
    sources:
      - path: VedicWidget
    dependencies:
      - target: VedicCore
        embed: true
      - target: VedicWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourteam.vedicwidget
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        CODE_SIGN_ENTITLEMENTS: VedicWidget/VedicWidget.entitlements
    info:
      path: VedicWidget/Info.plist
      properties:
        CFBundleDisplayName: Vedic
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSLocationWhenInUseUsageDescription: "Used to anchor today's auspicious and inauspicious windows to your current city. Never uploaded."
        CFBundleURLTypes:
          - CFBundleURLName: com.yourteam.vedicwidget.deeplink
            CFBundleURLSchemes: [vedicwidget]

  # ---------------------------------------------------------------------------
  # VedicWidgetExtension — WidgetKit extension (small / medium / large).
  # ---------------------------------------------------------------------------
  VedicWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: VedicWidgetExtension
    dependencies:
      - target: VedicCore
        embed: false
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourteam.vedicwidget.widget
        CODE_SIGN_ENTITLEMENTS: VedicWidgetExtension/VedicWidgetExtension.entitlements
    info:
      path: VedicWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Vedic
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ---------------------------------------------------------------------------
  # Tests — unit tests for the VedicCore framework.
  # ---------------------------------------------------------------------------
  VedicCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: VedicCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourteam.vedicwidget.core.tests

# -----------------------------------------------------------------------------
# Schemes
# -----------------------------------------------------------------------------
schemes:
  VedicWidget:
    build:
      targets:
        VedicWidget: all
        VedicWidgetExtension: all
        VedicCore: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VedicCoreTests
    archive:
      config: Release
