<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Kalinga Rush</title>
    <meta name="description" content="A one-button runner through 3,500 years of Kalinga and Odisha history, c. 1500 BCE to 2026." />
  </head>
  <body>
    <div id="app" class="is-loading is-title">
      <header id="hdr" aria-live="polite">
        <div class="hdr-label" id="hdr-label">Kalinga Rush · <span class="c">c.</span>1500 BCE → 2026</div>
        <div class="hdr-date" id="hdr-date"></div>
        <h1 class="hdr-headline" id="hdr-headline"></h1>
      </header>

      <section id="title" aria-label="Kalinga Rush">
        <div class="title-label">A picture reader · <span lang="or">ଆମ କଳିଙ୍ଗ</span></div>
        <h1 class="title-word"><span class="t1">Kalinga</span><span class="t2">Rush</span></h1>
        <p class="title-play" id="title-play">Play at <span class="gold" id="play-url"></span></p>
        <hr class="title-rule" />
        <p class="title-teaser">Ride with Taapoi through 3,500 years of Kalinga.<br />One button. Catch the palm-leaf records.</p>
      </section>

      <div id="stage">
        <div id="game"></div>
        <div id="overlay"></div>
      </div>

      <div id="hud" aria-label="Status">
        <div class="hud-diyas" id="hud-diyas" aria-label="Diyas left"></div>
        <div class="hud-right">
          <div class="hud-stat" id="hud-cowries" aria-label="Cowries"><span class="ico ico-cowrie"></span><b>0</b></div>
          <div class="hud-stat gold" id="hud-records" aria-label="Records caught"><span class="ico ico-leaf"></span><b>0</b><span class="of">/ 37</span></div>
          <button id="btn-pause" type="button" aria-label="Pause">II</button>
        </div>
      </div>

      <div id="below">
        <div class="menu" id="menu"><button class="btn btn-gold" id="btn-play" type="button">Play</button></div>
        <p class="below-hint" id="below-hint"></p>
      </div>

      <div id="card-layer" aria-live="polite"></div>
      <div id="ending" aria-live="polite"></div>
      <div id="loading" role="status"><div class="loading-inner"><span>Printing the reader…</span><i><b id="loading-bar"></b></i></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
